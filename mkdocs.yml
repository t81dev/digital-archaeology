site_name: Digital Archaeology
site_description: A comparative research framework and simulator suite for recovering and evaluating abandoned computing paradigms.
site_author: Digital Archaeology Initiative

validation:
  links:
    not_found: ignore
    unrecognized_links: ignore

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

docs_dir: docs_source
site_dir: site

exclude_docs: |
  **/.*
  *.py
  *.html
  *.json
  tools/**
  reconstructions/**/*.py
  reconstructions/**/*.txt
  LICENSE
  NOTES.md

