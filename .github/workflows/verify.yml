name: Repository Verification & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt

    - name: Run Pytest
      run: |
        pytest

    - name: Run Excavation and Linter Verification
      run: |
        python tools/verify_excavations.py

    - name: Set up MkDocs Source Symbolic Links
      run: |
        python tools/setup_docs.py

    - name: Build Static Site & Verify Navigation and Links
      run: |
        mkdocs build --strict
